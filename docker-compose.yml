services:
  mrt1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mrt1-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: change-me-in-production
      MRT_ADMIN_PASSWORD: change-me-in-production
      MRT_VAULT_PIN: "2026"
    restart: unless-stopped
